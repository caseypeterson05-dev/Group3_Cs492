openapi: 3.0.3
info:
  title: Pizza Pie Parlor API
  version: 2.1.0
  description: Portable local backend contract for the CS492 Pizza Pie Parlor project.
servers:
  - url: http://127.0.0.1:3000
    description: Default local development server
paths:
  /api/health:
    get:
      summary: Backend health check
      responses:
        '200':
          description: Backend is running
  /api/restaurant:
    get:
      summary: Get restaurant information
      responses:
        '200':
          description: Restaurant details for the homepage
  /api/menu:
    get:
      summary: Get grouped menu data and customization options
      responses:
        '200':
          description: Categories, active items, sizes, crusts, and toppings
  /api/menu/{itemId}:
    get:
      summary: Get one active menu item
      parameters:
        - in: path
          name: itemId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Menu item
        '404':
          description: Menu item not found
  /api/menu/price-preview:
    post:
      summary: Calculate server-side price for a menu item customization
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [itemId]
              properties:
                itemId:
                  type: string
                customization:
                  type: object
                  properties:
                    sizeId:
                      type: string
                      nullable: true
                    crustId:
                      type: string
                      nullable: true
                    toppingIds:
                      type: array
                      items:
                        type: string
      responses:
        '200':
          description: Validated price preview
        '400':
          description: Invalid menu item or customization
  /api/gallery:
    get:
      summary: Get gallery image metadata
      responses:
        '200':
          description: Gallery image list
  /api/promotions:
    get:
      summary: Get active promotions
      responses:
        '200':
          description: Active promotion list
  /api/promotions/validate:
    post:
      summary: Validate a promotion code against a subtotal
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, subtotal]
              properties:
                code:
                  type: string
                  example: PIZZA20
                subtotal:
                  type: number
                  minimum: 0
                  example: 50
      responses:
        '200':
          description: Promotion validation result
        '400':
          description: Missing/invalid input
  /api/cart:
    get:
      summary: Get the current cart
      parameters:
        - in: header
          name: X-Cart-Id
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Cart with subtotal, tax, and total
    delete:
      summary: Clear the current cart
      parameters:
        - in: header
          name: X-Cart-Id
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Cleared cart
  /api/cart/items:
    post:
      summary: Add an item to the cart or merge an identical line
      parameters:
        - in: header
          name: X-Cart-Id
          required: false
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [itemId]
              properties:
                itemId:
                  type: string
                quantity:
                  type: integer
                  minimum: 1
                  maximum: 99
                  default: 1
                customization:
                  type: object
                  properties:
                    sizeId:
                      type: string
                    crustId:
                      type: string
                    toppingIds:
                      type: array
                      items:
                        type: string
      responses:
        '201':
          description: New cart line created
        '200':
          description: Identical cart line merged and quantity updated
        '400':
          description: Invalid item, customization, or quantity
  /api/cart/items/{lineId}:
    patch:
      summary: Update a cart line quantity
      parameters:
        - in: path
          name: lineId
          required: true
          schema:
            type: string
        - in: header
          name: X-Cart-Id
          required: false
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [quantity]
              properties:
                quantity:
                  type: integer
                  minimum: 1
                  maximum: 99
      responses:
        '200':
          description: Updated cart line
        '400':
          description: Invalid quantity
        '404':
          description: Cart line not found
    delete:
      summary: Remove a cart line
      parameters:
        - in: path
          name: lineId
          required: true
          schema:
            type: string
        - in: header
          name: X-Cart-Id
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Cart line removed
        '404':
          description: Cart line not found
  /api/delivery/config:
    get:
      summary: Get delivery-radius configuration
      responses:
        '200':
          description: Delivery-radius configuration
  /api/delivery/validate:
    post:
      summary: Check whether coordinates are within the delivery radius
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [latitude, longitude]
              properties:
                latitude:
                  type: number
                  minimum: -90
                  maximum: 90
                longitude:
                  type: number
                  minimum: -180
                  maximum: 180
      responses:
        '200':
          description: Delivery-radius decision
        '400':
          description: Invalid coordinates
  /api/payments/status:
    get:
      summary: Get payment integration status
      responses:
        '200':
          description: Payment gateway configuration status
  /api/payments/create-session:
    post:
      summary: Safe payment gateway integration boundary
      description: Raw card data is rejected. A real PCI-compliant provider must tokenize payment details client-side.
      responses:
        '400':
          description: Raw card data was submitted
        '501':
          description: Gateway provider integration is not yet configured
  /api/openapi.yaml:
    get:
      summary: Download this OpenAPI contract
      responses:
        '200':
          description: OpenAPI YAML document
